<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Commander (Legacy)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎖️</text></svg>">
<style>
  :root {
    color-scheme: dark;
    --page: #0b0d11;
    --panel: #12151b;
    --panel-2: #181c24;
    --border: rgba(255, 255, 255, 0.09);
    --ink: #e8eaf0;
    --ink-2: #b4b9c6;
    --muted: #7c8395;
    --squad: #4aa3ff;
    --enemy: #ff5d5d;
    --gold: #ffd24a;
    --ok: #5bd17a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: rgba(255, 255, 255, 0.25); }
  button.primary { background: var(--squad); border-color: var(--squad); color: #051222; font-weight: 700; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--squad); outline-offset: 1px; }
  kbd { font: 11px ui-monospace, monospace; padding: 0 4px; border: 1px solid var(--border); border-radius: 4px; }

  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .brand { font-weight: 800; letter-spacing: 0.02em; font-size: 15px; }
  .brand span { color: var(--squad); }
  .topbar select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; min-width: 52px; text-align: center; }
  .round-label { color: var(--ink-2); }
  .jev { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .jev b { color: var(--ink); font-weight: 600; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
  .arena { position: relative; min-height: 0; }
  #map { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .feed { position: absolute; top: 10px; right: 12px; display: grid; gap: 4px; justify-items: end; pointer-events: none; }
  .feed div { background: rgba(10, 12, 16, 0.8); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .feed .squad { border-left: 3px solid var(--squad); }
  .feed .enemy { border-left: 3px solid var(--enemy); }
  .hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 10, 14, 0.78); backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .overlay .box { max-width: 520px; padding: 24px; text-align: center; display: grid; gap: 12px; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; color: var(--ink-2); }
  .overlay .win { color: var(--ok); }
  .overlay .lose { color: var(--enemy); }

  .side { border-left: 1px solid var(--border); display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
  .card { padding: 10px 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; min-height: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-2); font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--enemy); }
  .cam { position: relative; aspect-ratio: 4 / 3; background: #07080b; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .cam .sign { position: absolute; left: 8px; bottom: 6px; background: rgba(0, 0, 0, 0.6); border-radius: 6px; padding: 1px 8px; font-weight: 700; }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
  .signs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; color: var(--ink-2); }
  .signs span { background: var(--panel-2); border-radius: 6px; padding: 2px 4px; text-align: center; white-space: nowrap; }

  .ptt {
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px; font-weight: 700; user-select: none;
    position: relative; overflow: hidden;
  }
  .ptt.live { border-color: var(--enemy); color: #fff; }
  .ptt .level { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--enemy); width: 0; transition: width 80ms; }
  .caption { min-height: 20px; color: var(--gold); font-style: italic; }
  form { display: flex; gap: 6px; }
  form input { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }

  .log { overflow: auto; padding-right: 4px; display: grid; gap: 8px; align-content: start; }
  .entry { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: grid; gap: 4px; }
  .entry .said { font-weight: 600; }
  .entry .src { color: var(--muted); font-weight: 400; margin-right: 4px; }
  .entry .meta { color: var(--muted); font-size: 11px; }
  .entry .err { color: var(--enemy); font-size: 12px; }
  .plan { display: grid; grid-template-columns: 58px 1fr 40px; gap: 2px 6px; font-size: 12px; align-items: center; }
  .plan .skip { color: var(--muted); }
  .plan .p { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .squad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
  .agent { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
  .agent.dead { opacity: 0.4; }
  .agent .top { display: flex; justify-content: space-between; gap: 6px; }
  .agent .name { font-weight: 800; color: var(--squad); }
  .agent .hp { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .agent .hp i { display: block; height: 100%; background: var(--ok); }
  .agent .order { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent .probs { display: grid; gap: 2px; }
  .agent .prob { display: grid; grid-template-columns: 52px 1fr 30px; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
  .agent .prob.top { color: var(--ink); font-weight: 600; }
  .agent .bar { height: 6px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
  .agent .bar i { display: block; height: 100%; background: #2b5c8f; border-radius: 0 2px 2px 0; }
  .agent .prob.top .bar i { background: var(--squad); }
  .agent .brain { font-size: 11px; color: var(--muted); }

  @media (max-width: 900px) {
    body { overflow: auto; grid-template-rows: auto auto auto auto; }
    .layout { grid-template-columns: 1fr; }
    .arena { height: 60vh; }
    .side { border-left: 0; }
    .squad { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Jev <span>Commander</span> · Legacy</div>
  <select id="mode" aria-label="Scenario">
    <option value="titan">Titan Siege: Commander Erwin</option>
  </select>
  <button id="restart" type="button">Restart</button>
  <div class="clock" id="clock">–</div>
  <div class="round-label" id="roundLabel"></div>
  <div class="jev" id="jevStats">Jev idle</div>
</header>

<main class="layout">
  <section class="arena">
    <canvas id="map" aria-label="Battle map"></canvas>
    <div class="feed" id="feed"></div>
    <div class="hint">Click the map (or point at the camera) to mark a spot, then say “push there”.</div>
    <div class="overlay" id="overlay">
      <div class="box">
        <h2 id="overlayTitle">Jev Commander</h2>
        <p id="overlayText"></p>
        <div><button id="start" class="primary" type="button">Start</button></div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="card-head">Hand signals <button id="camBtn" type="button">Enable camera</button></div>
      <div class="cam">
        <video id="video" playsinline muted></video>
        <canvas id="hand"></canvas>
        <div class="off" id="camOff">Camera off. Hand signals: point to aim, hold a sign to give an order.</div>
        <div class="sign" id="sign" hidden></div>
      </div>
      <div class="signs" id="signs"></div>
      <div class="status" id="camStatus"></div>
    </div>
    <div class="card">
      <div class="card-head">Voice <button id="micBtn" type="button">Enable mic</button></div>
      <button id="ptt" class="ptt" type="button">🎙 Hold <kbd>V</kbd> to talk<span class="level" id="level"></span></button>
      <div class="caption" id="caption"></div>
      <form id="textForm">
        <input id="textInput" autocomplete="off" placeholder="Or type an order, e.g. “Alpha, Bravo push B. Charlie hold mid”">
        <button type="submit">Send</button>
      </form>
      <div class="status" id="micStatus"></div>
    </div>
    <div class="card" style="min-height:0">
      <div class="card-head">Orders → Jev</div>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>

<footer class="squad" id="squad"></footer>

<script type="module" src="./main.js"></script>
</body>
</html>
